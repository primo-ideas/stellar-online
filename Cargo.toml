[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-shared = { path = "crates/shared" }

# Bevy is slow to compile unoptimized and slow to run in debug: optimize dependencies.
[profile.dev.package."*"]
opt-level = 2
